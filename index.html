<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GladEyes</title>
  <meta name="description" content="GladEyes: an unofficial app for watching your own Plex media on Meta Ray-Ban Display glasses.">
  <meta name="application-name" content="GladEyes">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <!-- PNG favicon (>52px): SVG favicons are a known issue on the glasses -->
  <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div id="app" class="app-shell">

    <!-- One Back button for every screen. Always the first focusable element, top-left. -->
    <header id="topbar" class="topbar">
      <button id="back" class="back" type="button" aria-label="Back">
        <span aria-hidden="true">&lsaquo;</span> Back
      </button>
      <svg id="brand" class="brand" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="b-brow" d="M5 28 L16 12 L27 28"/><path class="b-brow" d="M37 28 L48 12 L59 28"/><path class="b-eye" d="M8 53 Q16 36 24 53"/><path class="b-eye" d="M40 53 Q48 36 56 53"/></svg>
      <h1 id="title" class="topbar-title">GladEyes</h1>
    </header>

    <main id="screen" class="screen"></main>

    <!-- Fullscreen player (shown only while playing) -->
    <section id="player" class="player" aria-label="Video player" hidden>
      <video id="video" playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>

      <!-- Small visible pill (always focusable): select on it opens the playback controls -->
      <button id="surface" class="hint" type="button" aria-label="Show playback controls"><span class="hint-text">Controls</span><span class="hint-dots" aria-hidden="true">&middot;&middot;&middot;</span></button>

      <div id="loading" class="loading" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="loadmsg">Loading&hellip;</span>
      </div>

      <div id="perr" class="perr" role="alert" hidden>
        <h2>Can&rsquo;t play this</h2>
        <p id="perr-msg"></p>
      </div>

      <div id="ctrl" class="controls" hidden>
        <p id="ptitle" class="ptitle"></p>
        <div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div>
        <p id="ptime" class="ptime"></p>
        <p id="pstat" class="pstat"></p>
        <div class="row" role="group" aria-label="Playback controls">
          <button id="b-rew" class="ctl" type="button">&minus;15s</button>
          <button id="b-play" class="ctl ctl-main" type="button">Pause</button>
          <button id="b-fwd" class="ctl" type="button">+15s</button>
          <button id="b-exit" class="ctl" type="button">Exit</button>
        </div>
      </div>
    </section>

  </div>
  <noscript>This app needs JavaScript.</noscript>

  <script src="config.js?v=9"></script>
  <script src="js/plex.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
